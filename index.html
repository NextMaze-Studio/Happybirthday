<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Surprise</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=DM+Sans:wght@300;400;500&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #030203;
}

body {
    font-family: "DM Sans", sans-serif;
    color: white;
    user-select: none;
    -webkit-user-select: none;
}

/* =========================================================
   MAIN CINEMATIC WORLD
========================================================= */

.cinema {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;

    background:
        radial-gradient(
            ellipse at 50% 50%,
            #4a1c32 0%,
            #28101b 30%,
            #0f060b 64%,
            #030203 100%
        );
}

/* =========================================================
   PINK AMBIENT LIGHT
========================================================= */

.ambient {
    position: absolute;

    width: 75vw;
    height: 75vw;

    max-width: 1000px;
    max-height: 1000px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(.65);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255, 105, 170, .25),
            rgba(255, 85, 155, .09) 38%,
            transparent 70%
        );

    filter: blur(45px);

    opacity: .15;

    transition:
        opacity 2.5s ease,
        transform 5s cubic-bezier(.16,1,.3,1);
}

.started .ambient {
    opacity: 1;

    transform:
        translate(-50%, -50%)
        scale(1.15);
}

/* =========================================================
   SOFT LIGHT RAYS
========================================================= */

.rays {
    position: absolute;
    inset: 0;

    pointer-events: none;

    opacity: 0;

    transition:
        opacity 2s ease;
}

.started .rays {
    opacity: 1;
}

.ray {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 1px;
    height: 75vh;

    transform-origin: center;

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(255, 180, 215, .13),
            transparent
        );
}

.ray:nth-child(1) {
    transform: rotate(20deg);
}

.ray:nth-child(2) {
    transform: rotate(-20deg);
}

.ray:nth-child(3) {
    transform: rotate(42deg);
    opacity: .4;
}

.ray:nth-child(4) {
    transform: rotate(-42deg);
    opacity: .4;
}

/* =========================================================
   PARTICLES
========================================================= */

.particles {
    position: absolute;
    inset: 0;

    overflow: hidden;

    pointer-events: none;
}

.particle {
    position: absolute;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: #ffd9e8;

    box-shadow:
        0 0 8px #ff9fc3,
        0 0 20px rgba(255, 100, 165, .7);

    opacity: 0;

    animation:
        floating 7s linear infinite;
}

.started .particle {
    opacity: .65;
}

.p1 {
    left: 8%;
    top: 75%;
    animation-delay: .2s;
}

.p2 {
    left: 17%;
    top: 55%;
    animation-delay: 1.2s;
}

.p3 {
    left: 27%;
    top: 82%;
    animation-delay: 2.4s;
}

.p4 {
    left: 40%;
    top: 68%;
    animation-delay: .8s;
}

.p5 {
    left: 53%;
    top: 78%;
    animation-delay: 3s;
}

.p6 {
    left: 66%;
    top: 62%;
    animation-delay: 1.8s;
}

.p7 {
    left: 78%;
    top: 81%;
    animation-delay: 2.7s;
}

.p8 {
    left: 90%;
    top: 58%;
    animation-delay: 1s;
}

.p9 {
    left: 12%;
    top: 30%;
    animation-delay: 3.4s;
}

.p10 {
    left: 35%;
    top: 35%;
    animation-delay: 2s;
}

.p11 {
    left: 72%;
    top: 34%;
    animation-delay: .6s;
}

.p12 {
    left: 93%;
    top: 25%;
    animation-delay: 3.8s;
}

@keyframes floating {

    0% {
        transform:
            translateY(50px)
            scale(.3);

        opacity: 0;
    }

    15% {
        opacity: .7;
    }

    50% {
        transform:
            translateY(-45px)
            scale(1);
    }

    100% {
        transform:
            translateY(-170px)
            scale(.2);

        opacity: 0;
    }
}

/* =========================================================
   CINEMATIC MASK
========================================================= */

.mask {
    position: absolute;

    left: 0;

    width: 100%;
    height: 50%;

    background: #000;

    z-index: 30;

    pointer-events: none;

    transition:
        height 1.8s cubic-bezier(.77,0,.18,1);
}

.mask.top {
    top: 0;
}

.mask.bottom {
    bottom: 0;
}

/*
   Initial:
   Almost completely closed.

   After interaction:
   Cinematic viewing window opens.
*/

.started .mask.top {
    height: 35%;
}

.started .mask.bottom {
    height: 35%;
}

/* =========================================================
   MAIN CONTENT
========================================================= */

.content {
    position: absolute;

    left: 50%;
    top: 50%;

    width: min(900px, 90vw);

    transform:
        translate(-50%, -50%)
        scale(.88);

    text-align: center;

    z-index: 10;

    opacity: 0;

    transition:
        opacity 1.5s ease 1s,
        transform 2s cubic-bezier(.16,1,.3,1) 1s;
}

.started .content {
    opacity: 1;

    transform:
        translate(-50%, -50%)
        scale(1);
}

/* =========================================================
   SMALL TOP TEXT
========================================================= */

.eyebrow {
    font-size: 10px;

    letter-spacing: 6px;

    text-transform: uppercase;

    color: #e7b4c9;

    margin-bottom: 28px;

    opacity: 0;

    transform: translateY(18px);

    transition:
        opacity 1s ease 1.35s,
        transform 1s ease 1.35s;
}

.started .eyebrow {
    opacity: .9;

    transform: translateY(0);
}

/* =========================================================
   HAPPY BIRTHDAY
========================================================= */

.title {
    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

    font-size:
        clamp(58px, 11vw, 145px);

    font-weight: 300;

    line-height: .76;

    letter-spacing: -5px;

    text-transform: uppercase;

    color: white;

    text-shadow:
        0 0 35px rgba(255,120,175,.18);
}

.title .happy {
    display: block;

    opacity: 0;

    transform: translateY(45px);

    transition:
        opacity 1.2s ease 1.25s,
        transform 1.4s cubic-bezier(.16,1,.3,1) 1.25s;
}

.title .birthday {
    display: block;

    color: #f2a1c2;

    font-style: italic;

    font-weight: 400;

    opacity: 0;

    transform: translateY(50px);

    transition:
        opacity 1.3s ease 1.45s,
        transform 1.5s cubic-bezier(.16,1,.3,1) 1.45s;
}

.started .title .happy,
.started .title .birthday {
    opacity: 1;

    transform: translateY(0);
}

/* =========================================================
   DIVIDER
========================================================= */

.line {
    width: 0;

    height: 1px;

    margin: 40px auto 25px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #e8a1bd,
            transparent
        );

    transition:
        width 1.5s cubic-bezier(.16,1,.3,1) 2.05s;
}

.started .line {
    width: 180px;
}

/* =========================================================
   SUBTITLE
========================================================= */

.subtitle {
    max-width: 650px;

    margin: auto;

    font-family:
        "DM Sans",
        sans-serif;

    font-size: 10px;

    line-height: 1.8;

    letter-spacing: 3px;

    color: #c8b8bf;

    text-transform: uppercase;

    opacity: 0;

    transform: translateY(18px);

    transition:
        opacity 1s ease 2.3s,
        transform 1s ease 2.3s;
}

.started .subtitle {
    opacity: 1;

    transform: translateY(0);
}

/* =========================================================
   OPENING SCREEN
========================================================= */

.start {
    position: absolute;

    inset: 0;

    z-index: 50;

    display: flex;

    align-items: center;
    justify-content: center;

    text-align: center;

    transition:
        opacity 1s ease,
        visibility 1s ease;
}

.started .start {
    opacity: 0;

    visibility: hidden;

    pointer-events: none;
}

.start-inner {
    transform: translateY(-5px);
}

.start-small {
    font-size: 9px;

    letter-spacing: 5px;

    text-transform: uppercase;

    color: #a9909c;

    margin-bottom: 25px;
}

.start-label {
    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

    font-size:
        clamp(35px, 5vw, 58px);

    line-height: .9;

    font-weight: 300;

    color: #f3d9e3;

    margin-bottom: 34px;

    text-shadow:
        0 0 25px rgba(255,130,180,.15);
}

.start-label span {
    color: #ed9fbd;

    font-style: italic;
}

/* =========================================================
   OPEN BUTTON
========================================================= */

.start-button {
    position: relative;

    min-width: 190px;

    padding: 16px 30px;

    border:
        1px solid rgba(255,174,204,.45);

    background:
        rgba(255,120,175,.035);

    color: #f6c7d9;

    font-family:
        "DM Sans",
        sans-serif;

    font-size: 9px;

    letter-spacing: 5px;

    text-transform: uppercase;

    cursor: pointer;

    overflow: hidden;

    transition:
        background .4s ease,
        border .4s ease,
        color .4s ease,
        transform .4s ease;
}

.start-button::before {
    content: "";

    position: absolute;

    left: -110%;
    top: 0;

    width: 100%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.15),
            transparent
        );

    transition:
        left .8s ease;
}

.start-button:hover::before {
    left: 110%;
}

.start-button:hover {
    color: white;

    border-color:
        rgba(255,190,215,.9);

    background:
        rgba(255,120,175,.12);

    transform:
        translateY(-2px);
}

/* =========================================================
   SWIPE HINT
========================================================= */

.swipe {
    position: absolute;

    bottom: 28px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 40;

    color: #75666e;

    font-size: 8px;

    letter-spacing: 4px;

    text-transform: uppercase;

    animation:
        breathe 2.2s ease-in-out infinite;

    transition:
        opacity .5s ease;
}

.started .swipe {
    opacity: 0;
}

@keyframes breathe {

    0%,
    100% {
        opacity: .25;
    }

    50% {
        opacity: .8;
    }
}

/* =========================================================
   REPLAY
========================================================= */

.replay {
    position: absolute;

    right: 22px;
    bottom: 22px;

    z-index: 90;

    padding: 9px 14px;

    border:
        1px solid rgba(255,255,255,.12);

    background:
        rgba(0,0,0,.25);

    color: #88777f;

    font-size: 8px;

    letter-spacing: 2px;

    cursor: pointer;

    opacity: 0;

    pointer-events: none;

    transition: .3s;
}

.started .replay {
    opacity: 1;

    pointer-events: auto;
}

.replay:hover {
    color: white;

    border-color:
        rgba(255,180,210,.45);
}

/* =========================================================
   VIGNETTE
========================================================= */

.vignette {
    position: absolute;

    inset: 0;

    z-index: 70;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse,
            transparent 25%,
            rgba(0,0,0,.25) 60%,
            rgba(0,0,0,.9) 100%
        );
}

/* =========================================================
   FILM GRAIN
========================================================= */

.grain {
    position: absolute;

    inset: -50%;

    z-index: 80;

    pointer-events: none;

    opacity: .045;

    background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='.5'/%3E%3C/svg%3E");

    animation:
        grain .18s steps(2) infinite;
}

@keyframes grain {

    0% {
        transform: translate(0,0);
    }

    25% {
        transform: translate(2%,-1%);
    }

    50% {
        transform: translate(-1%,2%);
    }

    75% {
        transform: translate(1%,1%);
    }

    100% {
        transform: translate(-2%,-1%);
    }
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .start-label {
        font-size: 38px;
    }

    .title {
        font-size: 58px;

        letter-spacing: -2px;
    }

    .eyebrow {
        font-size: 8px;

        letter-spacing: 4px;
    }

    .subtitle {
        font-size: 8px;

        letter-spacing: 1.8px;

        padding: 0 20px;
    }

    .started .mask.top,
    .started .mask.bottom {
        height: 38%;
    }

    .replay {
        right: 14px;
        bottom: 14px;
    }
}

/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;

        transition-duration: .01ms !important;
    }
}

</style>
</head>


<body>

<div class="cinema" id="cinema">

    <!-- =====================================================
         AMBIENT LIGHT
    ====================================================== -->

    <div class="ambient"></div>


    <!-- =====================================================
         LIGHT RAYS
    ====================================================== -->

    <div class="rays">

        <div class="ray"></div>
        <div class="ray"></div>
        <div class="ray"></div>
        <div class="ray"></div>

    </div>


    <!-- =====================================================
         PARTICLES
    ====================================================== -->

    <div class="particles">

        <div class="particle p1"></div>
        <div class="particle p2"></div>
        <div class="particle p3"></div>
        <div class="particle p4"></div>
        <div class="particle p5"></div>
        <div class="particle p6"></div>
        <div class="particle p7"></div>
        <div class="particle p8"></div>
        <div class="particle p9"></div>
        <div class="particle p10"></div>
        <div class="particle p11"></div>
        <div class="particle p12"></div>

    </div>


    <!-- =====================================================
         MAIN BIRTHDAY CONTENT
    ====================================================== -->

    <main class="content">

        <div class="eyebrow">
            For all the memories, laughter & moments
        </div>


        <h1 class="title">

            <span class="happy">
                Happy
            </span>

            <span class="birthday">
                Birthday
            </span>

        </h1>


        <div class="line"></div>


        <div class="subtitle">
            Here's to another beautiful chapter of your life
        </div>

    </main>


    <!-- =====================================================
         CINEMATIC MASKS
    ====================================================== -->

    <div class="mask top"></div>
    <div class="mask bottom"></div>


    <!-- =====================================================
         START SCREEN
    ====================================================== -->

    <section class="start" id="start">

        <div class="start-inner">

            <div class="start-small">
                Just for you
            </div>


            <div class="start-label">

                Here's a little<br>

                <span>
                    surprise
                </span>

                for you

            </div>


            <button
                class="start-button"
                id="startButton"
                type="button"
            >
                Open Surprise
            </button>

        </div>

    </section>


    <!-- =====================================================
         SWIPE HINT
    ====================================================== -->

    <div class="swipe">
        Press or swipe up
    </div>


    <!-- =====================================================
         REPLAY
    ====================================================== -->

    <button
        class="replay"
        id="replay"
        type="button"
    >
        Replay
    </button>


    <!-- =====================================================
         VFX
    ====================================================== -->

    <div class="vignette"></div>

    <div class="grain"></div>

</div>


<script>

const cinema =
    document.getElementById("cinema");

const startButton =
    document.getElementById("startButton");

const replay =
    document.getElementById("replay");


let started = false;


/* =========================================================
   START CINEMATIC
========================================================= */

function startCinema() {

    if (started) return;

    started = true;

    cinema.classList.add("started");

}


/* =========================================================
   BUTTON
========================================================= */

startButton.addEventListener(
    "click",
    startCinema
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.code === "Space" ||
            event.code === "Enter"
        ) {

            if (!started) {

                startCinema();

            }

        }

    }
);


/* =========================================================
   TOUCH SWIPE
========================================================= */

let touchStartY = 0;

cinema.addEventListener(
    "touchstart",
    function(event) {

        touchStartY =
            event.touches[0].clientY;

    },
    {
        passive: true
    }
);


cinema.addEventListener(
    "touchend",
    function(event) {

        const touchEndY =
            event.changedTouches[0].clientY;

        const distance =
            touchStartY - touchEndY;


        if (
            distance > 40 &&
            !started
        ) {

            startCinema();

        }

    },
    {
        passive: true
    }
);


/* =========================================================
   MOUSE SWIPE
========================================================= */

let mouseStartY = null;

cinema.addEventListener(
    "mousedown",
    function(event) {

        mouseStartY =
            event.clientY;

    }
);


cinema.addEventListener(
    "mouseup",
    function(event) {

        if (mouseStartY === null)
            return;


        const distance =
            mouseStartY - event.clientY;


        if (
            distance > 40 &&
            !started
        ) {

            startCinema();

        }


        mouseStartY = null;

    }
);


/* =========================================================
   REPLAY
========================================================= */

replay.addEventListener(
    "click",
    function() {

        started = false;

        cinema.classList.remove(
            "started"
        );

    }
);

</script>

</body>
</html>
